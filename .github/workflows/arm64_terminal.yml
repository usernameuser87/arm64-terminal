name: ARM64 Interactive Shell

on:
  workflow_dispatch:

jobs:
  arm64-debug:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Tampilkan info arsitektur
        run: |
          uname -m
          lscpu
      - name: Jalankan Terminal Interaktif Upterm
        uses: owenthereal/action-upterm@v1
        with:
          limit-access-to-actor: true
