name: ARM64 Interactive Shell

on:
  workflow_dispatch:

jobs:
  arm64-debug:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Tampilkan Arsitektur CPU
        run: |
          uname -m
          lscpu

      - name: Jalankan Terminal Interaktif Tmate
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
