name: Dump DexProtector ARM64

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Setup Kernel & Redroid Android
        run: |
          echo "=== 1. PREPARE KERNEL & PACKAGES ==="
          sudo modprobe binder_linux
          sudo apt-get update && sudo apt-get install -y adb python3-pip python3-venv xz-utils wget
          
          echo "=== 2. RUN REDROID STANDARD ==="
          sudo docker run -itd --privileged -p 5555:5555 --name redroid redroid/redroid:11.0.0-latest
          
          echo "=== 3. WAIT FOR ANDROID BOOT COMPLETED ==="
          for i in {1..40}; do
            adb connect localhost:5555 || true
            BOOT=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then
              echo "Android system fully booted and package manager ready!"
              break
            fi
            echo "Waiting for Android boot_completed... ($i/40)"
            sleep 2
          done
          
          # Restart adbd as root cleanly
          adb -s localhost:5555 root || true
          sleep 4
          adb disconnect localhost:5555 || true
          adb connect localhost:5555 || true
          adb -s localhost:5555 wait-for-device || true
          adb -s localhost:5555 shell "id" || true
          adb devices

      - name: Download & Install APK
        run: |
          adb connect localhost:5555 || true
          wget -q -O /tmp/klikindo.apk https://github.com/usernameuser87/arm64-terminal/releases/download/apk-v1/klikindomaret_signed.apk
          ls -lh /tmp/klikindo.apk
          for attempt in {1..5}; do
            if adb -s localhost:5555 install -r /tmp/klikindo.apk; then
              echo "APK installed successfully!"
              break
            fi
            echo "Install failed, retrying in 3s... ($attempt/5)"
            sleep 3
          done
          adb -s localhost:5555 shell pm list packages | grep indomaret

      - name: Setup Root Frida Server & Dump DEX
        run: |
          adb connect localhost:5555 || true

          python3 -m venv ~/venv
          ~/venv/bin/pip install frida frida-tools frida-dexdump

          # Setup Frida Server di Android
          curl -sL https://github.com/frida/frida/releases/download/17.25.0/frida-server-17.25.0-android-arm64.xz -o /tmp/frida.xz
          xz -d -f /tmp/frida.xz
          adb -s localhost:5555 push /tmp/frida /data/local/tmp/frida-server
          adb -s localhost:5555 shell "chmod 755 /data/local/tmp/frida-server"
          adb -s localhost:5555 shell "nohup /data/local/tmp/frida-server >/dev/null 2>&1 < /dev/null &"
          sleep 4
          ~/venv/bin/frida-ps -U | head -n 10

          mkdir -p ~/dumped_dex

          cat << 'EOF' > /tmp/active_sweeper.py
          import frida, time, os, sys, hashlib

          out_dir = os.path.expanduser("~/dumped_dex")
          os.makedirs(out_dir, exist_ok=True)
          seen_md5 = set()
          dump_count = 0

          def save_dex(data, tag="scan"):
              global dump_count
              if data and len(data) > 0x1000:
                  m = hashlib.md5(data).hexdigest()
                  if m not in seen_md5:
                      seen_md5.add(m)
                      dump_count += 1
                      fpath = os.path.join(out_dir, f"dex_{dump_count:02d}_{tag}_{m[:8]}.dex")
                      with open(fpath, "wb") as f:
                          f.write(data)
                      print(f"[🔥 SUCCESS DUMP] {fpath} ({len(data)/1024/1024:.2f} MB)")

          def on_message(message, data):
              if message.get('type') == 'send':
                  payload = message.get('payload', {})
                  if isinstance(payload, dict) and payload.get('type') == 'dex_opened':
                      save_dex(data, "art_open")
                  elif isinstance(payload, str):
                      print(f"[*] {payload}")

          js_code = """
          // 1. Intercept abort, exit, kill, tgkill to prevent instant death
          ['exit', '_exit', 'abort', 'kill', 'tgkill'].forEach(function(sym) {
              var p = Module.findExportByName("libc.so", sym);
              if (p) {
                  Interceptor.attach(p, {
                      onEnter: function() {
                          console.log("[🛡️] Intercepted " + sym + " - sleeping thread to keep memory alive!");
                          Thread.sleep(60);
                      }
                  });
              }
          });

          // 2. Intercept Java Uncaught Exception Handler
          Java.perform(function() {
              try {
                  var ThreadClass = Java.use("java.lang.Thread");
                  var Handler = Java.registerClass({
                      name: "com.stealth.QuietHandler",
                      implements: [Java.use("java.lang.Thread$UncaughtExceptionHandler")],
                      methods: {
                          uncaughtException: function(t, e) {
                              console.log("[🛡️ CAUGHT JAVA FATAL] " + e);
                          }
                      }
                  });
                  ThreadClass.setDefaultUncaughtExceptionHandler(Handler.$new());
              } catch(e) {
                  console.log("Handler hook error: " + e);
              }
          });

          // 3. Hook Art DexFile::OpenCommon
          var artModule = Process.findModuleByName("libart.so");
          if (artModule) {
              artModule.enumerateExports().forEach(function(exp) {
                  if (exp.name.indexOf("DexFile") !== -1 && exp.name.indexOf("OpenCommon") !== -1) {
                      console.log("[+] Hooking Art OpenCommon: " + exp.name);
                      try {
                          Interceptor.attach(exp.address, {
                              onEnter: function(args) {
                                  var base = args[1];
                                  var size = args[2].toInt32();
                                  try {
                                      var magic = base.readCString(4);
                                      if (magic === "dex\\n") {
                                          send({ type: "dex_opened" }, base.readByteArray(size));
                                      }
                                  } catch(e) {}
                              }
                          });
                      } catch(e) {}
                  }
              });
          }

          rpc.exports = {
              scandex: function() {
                  var list = [];
                  Process.enumerateRanges('r--').forEach(function(m) {
                      try {
                          var magic = m.base.readCString(4);
                          if (magic === "dex\\n") {
                              var size = m.base.add(0x20).readU32();
                              if (size > 0x1000 && size < 0x3000000) {
                                  list.push({ base: m.base.toString(), size: size });
                              }
                          }
                      } catch(e) {}
                  });
                  return list;
              },
              dumpbytes: function(baseStr, size) {
                  return ptr(baseStr).readByteArray(size);
              }
          };
          """

          device = frida.get_usb_device()
          print("[*] Spawning com.indomaret.klikindomaret...")
          pid = device.spawn(["com.indomaret.klikindomaret"])
          session = device.attach(pid)
          script = session.create_script(js_code)
          script.on('message', on_message)
          script.load()

          print("[*] Resuming target process...")
          device.resume(pid)

          # Active sweep loop every 500ms for 16 seconds
          for tick in range(32):
              time.sleep(0.5)
              try:
                  ranges = script.exports_sync.scandex()
                  if ranges:
                      for item in ranges:
                          data = script.exports_sync.dumpbytes(item['base'], item['size'])
                          save_dex(data, f"tick_{tick:02d}")
              except Exception as e:
                  pass

          print(f"[✔] Total file DEX tersimpan: {len(seen_md5)}")
          session.detach()
          EOF

          ~/venv/bin/python /tmp/active_sweeper.py || true
          adb -s localhost:5555 logcat -d | grep -iE 'indomaret|AndroidRuntime|ProtectedApp' | tail -n 35 || true

          echo "=== DAFTAR FILE DUMPED DEX ==="
          ls -lh ~/dumped_dex/

      - name: Upload Dumped DEX to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: klikindomaret-dumped-dex
          path: ~/dumped_dex/
