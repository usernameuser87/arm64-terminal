name: Decrypt DexProtector Strings ARM64

on:
  workflow_dispatch:

jobs:
  decrypt:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Kernel & Redroid Android
        run: |
          echo "=== 1. PREPARE KERNEL & PACKAGES ==="
          sudo modprobe binder_linux
          sudo sysctl -w fs.suid_dumpable=2 || true
          sudo apt-get update && sudo apt-get install -y adb python3-pip python3-venv xz-utils wget zip
          
          echo "=== 2. RUN REDROID STANDARD ==="
          sudo docker run -itd --privileged -p 5555:5555 --name redroid redroid/redroid:11.0.0-latest
          
          echo "=== 3. WAIT FOR ANDROID BOOT COMPLETED ==="
          for i in {1..40}; do
            adb connect localhost:5555 || true
            BOOT=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then
              echo "Android system fully booted and ready!"
              break
            fi
            echo "Waiting for Android boot_completed... ($i/40)"
            sleep 2
          done
          
          # Restart adbd as root cleanly
          adb -s localhost:5555 root || true
          sleep 4
          adb disconnect localhost:5555 || true
          adb connect localhost:5555 || true
          adb -s localhost:5555 wait-for-device || true
          adb -s localhost:5555 shell "id" || true
          adb devices

      - name: Download & Install Target APK
        run: |
          adb connect localhost:5555 || true
          wget -q -O /tmp/klikindo.apk https://github.com/usernameuser87/arm64-terminal/releases/download/apk-v1/klikindomaret_signed.apk
          ls -lh /tmp/klikindo.apk
          for attempt in {1..5}; do
            if adb -s localhost:5555 install -r /tmp/klikindo.apk; then
              echo "APK installed successfully!"
              break
            fi
            echo "Install failed, retrying in 3s... ($attempt/5)"
            sleep 3
          done
          adb -s localhost:5555 shell pm list packages | grep indomaret

      - name: Setup Root Frida Server
        run: |
          adb connect localhost:5555 || true
          python3 -m venv ~/venv
          ~/venv/bin/pip install frida frida-tools

          curl -sL https://github.com/frida/frida/releases/download/17.25.0/frida-server-17.25.0-android-arm64.xz -o /tmp/frida.xz
          xz -d -f /tmp/frida.xz
          adb -s localhost:5555 push /tmp/frida /data/local/tmp/frida-server
          adb -s localhost:5555 shell "chmod 755 /data/local/tmp/frida-server"
          adb -s localhost:5555 shell "nohup /data/local/tmp/frida-server >/dev/null 2>&1 < /dev/null &"
          sleep 4
          ~/venv/bin/frida-ps -U | head -n 10

      - name: Decrypt All 2903 Strings via Frida Hook
        run: |
          adb connect localhost:5555 || true
          mkdir -p $GITHUB_WORKSPACE/results

          # Create app cache directory and set full permissions
          adb -s localhost:5555 shell "mkdir -p /data/data/com.indomaret.klikindomaret/cache"
          adb -s localhost:5555 shell "chmod 777 /data/data/com.indomaret.klikindomaret /data/data/com.indomaret.klikindomaret/cache"

          # Push target strings list
          adb -s localhost:5555 push all_enc_strings.txt /data/data/com.indomaret.klikindomaret/cache/all_enc_strings.txt
          adb -s localhost:5555 shell "chmod 777 /data/data/com.indomaret.klikindomaret/cache/all_enc_strings.txt"

          ~/venv/bin/python runner_decrypt.py || true

          # Pull decrypted strings from container cache
          adb -s localhost:5555 pull /data/data/com.indomaret.klikindomaret/cache/all_decrypted_strings.txt $GITHUB_WORKSPACE/results/ || true

          echo "=== PREVIEW DECRYPTED STRINGS ==="
          head -n 40 $GITHUB_WORKSPACE/results/all_decrypted_strings.txt || true
          wc -l $GITHUB_WORKSPACE/results/all_decrypted_strings.txt || true

      - name: Upload Decrypted Strings to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: klikindomaret-all-decrypted-strings
          path: ${{ github.workspace }}/results/all_decrypted_strings.txt
