name: Decrypt DexProtector Strings ARM64

on:
  workflow_dispatch:

jobs:
  decrypt:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Kernel & Redroid Android
        run: |
          echo "=== 1. PREPARE KERNEL & PACKAGES ==="
          sudo modprobe binder_linux
          sudo apt-get update && sudo apt-get install -y adb wget zip
          
          echo "=== 2. RUN REDROID STANDARD ==="
          sudo docker run -itd --privileged -p 5555:5555 --name redroid redroid/redroid:11.0.0-latest
          
          echo "=== 3. WAIT FOR ANDROID BOOT COMPLETED ==="
          for i in {1..40}; do
            adb connect localhost:5555 || true
            BOOT=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then
              echo "Android system fully booted and ready!"
              break
            fi
            echo "Waiting for Android boot_completed... ($i/40)"
            sleep 2
          done
          
          # Restart adbd as root cleanly
          adb -s localhost:5555 root || true
          sleep 4
          adb disconnect localhost:5555 || true
          adb connect localhost:5555 || true
          adb -s localhost:5555 wait-for-device || true
          adb -s localhost:5555 shell "id" || true
          adb devices

      - name: Download & Install Target APK
        run: |
          adb connect localhost:5555 || true
          wget -q -O /tmp/klikindo.apk https://github.com/usernameuser87/arm64-terminal/releases/download/apk-v1/klikindomaret_signed.apk
          ls -lh /tmp/klikindo.apk
          for attempt in {1..5}; do
            if adb -s localhost:5555 install -r /tmp/klikindo.apk; then
              echo "APK installed successfully!"
              break
            fi
            echo "Install failed, retrying in 3s... ($attempt/5)"
            sleep 3
          done
          adb -s localhost:5555 shell pm list packages | grep indomaret

      - name: Execute Native DexProtector String Decryptor
        run: |
          adb connect localhost:5555 || true
          
          # Push decryptor DEX and enc strings
          adb -s localhost:5555 push decryptor.dex /data/local/tmp/decryptor.dex
          adb -s localhost:5555 push all_enc_strings.txt /data/local/tmp/all_enc_strings.txt
          adb -s localhost:5555 shell "chmod 777 /data/local/tmp/decryptor.dex /data/local/tmp/all_enc_strings.txt"

          # Get base APK path
          APK_PATH=$(adb -s localhost:5555 shell pm path com.indomaret.klikindomaret | tr -d '\r' | cut -d: -f2 | head -n 1)
          echo "Target APK Path: $APK_PATH"

          # Extract libdexprotector.so from APK and place into /data/local/tmp/
          unzip -p /tmp/klikindo.apk lib/arm64-v8a/libdexprotector.so > /tmp/libdex.so
          adb -s localhost:5555 push /tmp/libdex.so /data/local/tmp/libdexprotector.so
          adb -s localhost:5555 shell "chmod 777 /data/local/tmp/libdexprotector.so"

          # Execute Decryptor via app_process
          echo "[*] Invoking Decryptor via app_process..."
          adb -s localhost:5555 shell "CLASSPATH=/data/local/tmp/decryptor.dex:$APK_PATH app_process /data/local/tmp Decryptor"

          mkdir -p $GITHUB_WORKSPACE/results
          adb -s localhost:5555 pull /data/local/tmp/all_decrypted_strings.txt $GITHUB_WORKSPACE/results/ || true

          echo "=== PREVIEW DECRYPTED STRINGS ==="
          head -n 35 $GITHUB_WORKSPACE/results/all_decrypted_strings.txt || true
          wc -l $GITHUB_WORKSPACE/results/all_decrypted_strings.txt || true

      - name: Upload Decrypted Strings to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: klikindomaret-all-decrypted-strings
          path: ${{ github.workspace }}/results/all_decrypted_strings.txt
