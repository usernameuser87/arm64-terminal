name: Dump DexProtector ARM64

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Setup Kernel & Redroid Android
        run: |
          echo "=== 1. PREPARE KERNEL & PACKAGES ==="
          sudo modprobe binder_linux
          sudo apt-get update && sudo apt-get install -y adb python3-pip python3-venv xz-utils wget openjdk-17-jdk-headless
          
          echo "=== 2. RUN REDROID ANDROID 11 ==="
          sudo docker run -itd --privileged -p 5555:5555 --name redroid redroid/redroid:11.0.0-latest
          
          echo "=== 3. WAIT FOR ANDROID BOOT COMPLETED ==="
          for i in {1..40}; do
            adb connect localhost:5555 || true
            BOOT=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then
              echo "Android system fully booted and package manager ready!"
              break
            fi
            echo "Waiting for Android boot_completed... ($i/40)"
            sleep 2
          done
          adb -s localhost:5555 root || true
          sleep 2
          adb connect localhost:5555 || true
          adb -s localhost:5555 shell "id"
          adb devices

      - name: Download & Install Untouched Signed APK
        run: |
          adb connect localhost:5555 || true
          wget -q -O /tmp/klikindo.apk https://github.com/usernameuser87/arm64-terminal/releases/download/apk-v1/klikindomaret_signed.apk
          ls -lh /tmp/klikindo.apk
          for attempt in {1..5}; do
            if adb -s localhost:5555 install -r /tmp/klikindo.apk; then
              echo "APK installed successfully!"
              break
            fi
            echo "Install failed, retrying in 3s... ($attempt/5)"
            sleep 3
          done
          adb -s localhost:5555 shell pm list packages | grep indomaret

      - name: Setup Root Frida Server & Dump DEX
        run: |
          adb connect localhost:5555 || true
          adb -s localhost:5555 root || true
          sleep 2
          adb connect localhost:5555 || true

          python3 -m venv ~/venv
          ~/venv/bin/pip install frida frida-tools

          # Setup Frida Server di Android
          curl -sL https://github.com/frida/frida/releases/download/17.25.0/frida-server-17.25.0-android-arm64.xz -o /tmp/frida.xz
          xz -d -f /tmp/frida.xz
          adb -s localhost:5555 push /tmp/frida /data/local/tmp/frida-server
          adb -s localhost:5555 shell "chmod 755 /data/local/tmp/frida-server"
          adb -s localhost:5555 shell "nohup /data/local/tmp/frida-server >/dev/null 2>&1 < /dev/null &"
          sleep 4
          ~/venv/bin/frida-ps -U | head -n 10

          mkdir -p ~/dumped_dex

          # Set app into waiting-for-debugger mode
          echo "[*] Setting debug-app waiting mode..."
          adb -s localhost:5555 shell am set-debug-app -w --persistent com.indomaret.klikindomaret

          # Launch activity (it will pause at start waiting for debugger)
          echo "[*] Launching paused activity..."
          adb -s localhost:5555 shell am start -n com.indomaret.klikindomaret/.ngsCexmFBytBw
          sleep 3

          # Check PID
          PID=$(adb -s localhost:5555 shell pidof com.indomaret.klikindomaret | tr -d '\r' | awk '{print $1}')
          echo "Target Paused PID: $PID"

          # Forward JDWP port
          adb -s localhost:5555 forward tcp:8100 jdwp:$PID
          echo "Forwarded JDWP port 8100 to PID $PID"

          cat << 'EOF' > /tmp/wait_dumper.py
          import frida, time, os, sys, hashlib, subprocess

          pid = int(sys.argv[1])
          device = frida.get_usb_device()
          print(f"[*] Attaching to paused process PID: {pid} as ROOT...")
          session = device.attach(pid)

          out_dir = os.path.expanduser("~/dumped_dex")
          os.makedirs(out_dir, exist_ok=True)
          seen_md5 = set()
          dump_count = 0

          def on_message(message, data):
              global dump_count
              if message.get('type') == 'send' and message.get('payload', {}).get('type') == 'dex_opened':
                  if data:
                      m = hashlib.md5(data).hexdigest()
                      if m not in seen_md5:
                          seen_md5.add(m)
                          dump_count += 1
                          fpath = os.path.join(out_dir, f"opencommon_{dump_count:02d}_{m[:8]}.dex")
                          with open(fpath, "wb") as f:
                              f.write(data)
                          print(f"[🔥 INTERCEPTED DEX] Saved to {fpath} ({len(data)/1024/1024:.2f} MB)")

          js_code = """
          rpc.exports = {
              scandex: function() {
                  var list = [];
                  Process.enumerateRanges('r--').forEach(function(m) {
                      try {
                          var magic = m.base.readCString(4);
                          if (magic === "dex\\n") {
                              var size = m.base.add(0x20).readU32();
                              if (size > 0x1000 && size < 0x3000000) {
                                  list.push({ base: m.base.toString(), size: size });
                              }
                          }
                      } catch(e) {}
                  });
                  return list;
              },
              dumpbytes: function(baseStr, size) {
                  return ptr(baseStr).readByteArray(size);
              }
          };

          Java.perform(function() {
              console.log("[*] Injected into paused process!");
              try {
                  var ProtectedApp = Java.use("edts.klikidm.android.ProtectedApp");
                  ProtectedApp.b.implementation = function() {
                      console.log("[🔥] BYPASSED ProtectedApp.b() Certificate Check successfully!");
                      return;
                  };
              } catch(e) {
                  console.log("[-] Error hooking ProtectedApp.b: " + e);
              }
          });

          // Hook libart DexFile::OpenCommon to intercept ANY decrypted DEX
          var artModule = Process.findModuleByName("libart.so");
          if (artModule) {
              artModule.enumerateExports().forEach(function(exp) {
                  if (exp.name.indexOf("DexFile") !== -1 && exp.name.indexOf("OpenCommon") !== -1) {
                      console.log("[+] Intercepting Art OpenCommon: " + exp.name);
                      try {
                          Interceptor.attach(exp.address, {
                              onEnter: function(args) {
                                  var base = args[1];
                                  var size = args[2].toInt32();
                                  try {
                                      var magic = base.readCString(4);
                                      if (magic === "dex\\n") {
                                          send({ type: "dex_opened", base: base.toString(), size: size }, base.readByteArray(size));
                                      }
                                  } catch(e) {}
                              }
                          });
                      } catch(e) {}
                  }
              });
          }
          """

          script = session.create_script(js_code)
          script.on('message', on_message)
          script.load()
          print("[*] Hook loaded in memory!")

          # Resume process using jdb attach command
          print("[*] Resuming paused process via jdb...")
          subprocess.run(["jdb", "-attach", "localhost:8100"], input=b"exit\n", capture_output=True)
          print("[+] JDB resume signal sent!")

          print("[*] Waiting 15s for DexProtector to decrypt assets.dat into RAM...")
          time.sleep(15)

          # Sweep memory ranges
          try:
              ranges = script.exports_sync.scandex()
              print(f"[*] Memory range scan found {len(ranges)} DEX blocks in RAM")
              for item in ranges:
                  data = script.exports_sync.dumpbytes(item['base'], item['size'])
                  if data:
                      m = hashlib.md5(data).hexdigest()
                      if m not in seen_md5:
                          seen_md5.add(m)
                          dump_count += 1
                          fpath = os.path.join(out_dir, f"memory_dump_{dump_count:02d}_{m[:8]}.dex")
                          with open(fpath, "wb") as f:
                              f.write(data)
                          print(f"[+] Dumped DEX: {fpath} ({item['size']/1024/1024:.2f} MB)")
          except Exception as e:
              print(f"[-] Scan exception: {e}")

          session.detach()
          print(f"[✔] Total file DEX terdekripsi yang tersimpan: {len(seen_md5)}")
          EOF

          if [ -n "$PID" ]; then
            ~/venv/bin/python /tmp/wait_dumper.py "$PID" || true
          else
            echo "[-] PID not found!"
          fi

          adb -s localhost:5555 logcat -d | grep -iE 'indomaret|AndroidRuntime|ProtectedApp' | tail -n 35 || true

          echo "=== DAFTAR FILE DUMPED DEX ==="
          ls -lh ~/dumped_dex/

      - name: Upload Dumped DEX to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: klikindomaret-dumped-dex
          path: ~/dumped_dex/
