name: Dump DexProtector ARM64

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Setup Kernel & Redroid Android
        run: |
          echo "=== 1. PREPARE KERNEL & PACKAGES ==="
          sudo modprobe binder_linux
          sudo apt-get update && sudo apt-get install -y adb python3 wget
          
          echo "=== 2. RUN REDROID STANDARD ==="
          sudo docker run -itd --privileged -p 5555:5555 --name redroid redroid/redroid:11.0.0-latest
          
          echo "=== 3. WAIT FOR ANDROID BOOT COMPLETED ==="
          for i in {1..40}; do
            adb connect localhost:5555 || true
            BOOT=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then
              echo "Android system fully booted and package manager ready!"
              break
            fi
            echo "Waiting for Android boot_completed... ($i/40)"
            sleep 2
          done
          
          # Restart adbd as root cleanly
          adb -s localhost:5555 root || true
          sleep 4
          adb disconnect localhost:5555 || true
          adb connect localhost:5555 || true
          adb -s localhost:5555 wait-for-device || true
          adb -s localhost:5555 shell "id" || true
          adb devices

      - name: Download & Install APK
        run: |
          adb connect localhost:5555 || true
          wget -q -O /tmp/klikindo.apk https://github.com/usernameuser87/arm64-terminal/releases/download/apk-v1/klikindomaret_signed.apk
          ls -lh /tmp/klikindo.apk
          for attempt in {1..5}; do
            if adb -s localhost:5555 install -r /tmp/klikindo.apk; then
              echo "APK installed successfully!"
              break
            fi
            echo "Install failed, retrying in 3s... ($attempt/5)"
            sleep 3
          done
          adb -s localhost:5555 shell pm list packages | grep indomaret

      - name: Host Kernel RAM Dumper (Zero-Intrusion)
        run: |
          adb connect localhost:5555 || true
          mkdir -p ~/dumped_dex

          cat << 'PYEOF' > /tmp/host_dumper.py
          import sys, os, struct, time, hashlib, subprocess

          out_dir = os.path.expanduser("~/dumped_dex")
          os.makedirs(out_dir, exist_ok=True)
          seen_md5 = set()
          dump_count = 0

          def find_target_pid():
              try:
                  out = subprocess.check_output(["sudo", "docker", "top", "redroid"], text=True)
                  for line in out.splitlines():
                      if "com.indomaret.klikindomaret" in line:
                          parts = line.split()
                          return int(parts[1])
              except:
                  pass
              return None

          print("[*] Launching app via adb...")
          subprocess.run(["adb", "-s", "localhost:5555", "shell", "am", "start", "-n", "com.indomaret.klikindomaret/.ngsCexmFBytBw"])

          target_pid = None
          for _ in range(80):
              target_pid = find_target_pid()
              if target_pid:
                  break
              time.sleep(0.05)

          if not target_pid:
              print("[-] Could not find host PID for target!")
              sys.exit(0)

          print(f"[🔥 TARGET DETECTED] Host PID: {target_pid}")
          # Immediately pause the process with SIGSTOP from the host so it CANNOT exit or crash
          subprocess.run(["sudo", "kill", "-STOP", str(target_pid)])
          print(f"[❄️ FROZEN] Target host PID {target_pid} frozen in RAM via SIGSTOP!")

          try:
              with open(f"/proc/{target_pid}/maps", "r") as mf:
                  maps = mf.readlines()
          except Exception as e:
              print(f"[-] Could not read maps: {e}")
              maps = []

          print(f"[*] Total memory mappings in target: {len(maps)}")

          try:
              mem = open(f"/proc/{target_pid}/mem", "rb", 0)
          except Exception as e:
              print(f"[-] Could not open /proc/{target_pid}/mem: {e}")
              mem = None

          if mem:
              for line in maps:
                  parts = line.split()
                  if len(parts) < 2: continue
                  addr_range = parts[0]
                  perms = parts[1]
                  if "r" in perms:
                      start_hex, end_hex = addr_range.split("-")
                      start = int(start_hex, 16)
                      end = int(end_hex, 16)
                      size = end - start
                      if 0x1000 < size < 0x8000000:
                          try:
                              mem.seek(start)
                              chunk = mem.read(size)
                              pos = 0
                              while True:
                                  idx = chunk.find(b"dex\n", pos)
                                  if idx == -1: break
                                  if idx + 0x24 <= len(chunk):
                                      dex_size = struct.unpack("<I", chunk[idx+0x20 : idx+0x24])[0]
                                      if 0x1000 < dex_size <= (len(chunk) - idx + 0x1000):
                                          dex_bytes = chunk[idx : idx + dex_size]
                                          m = hashlib.md5(dex_bytes).hexdigest()
                                          if m not in seen_md5:
                                              seen_md5.add(m)
                                              dump_count += 1
                                              fpath = os.path.join(out_dir, f"memory_dex_{dump_count:02d}_{m[:8]}.dex")
                                              with open(fpath, "wb") as out:
                                                  out.write(dex_bytes)
                                              print(f"[🔥 SUCCESS DUMP] {fpath} ({len(dex_bytes)/1024/1024:.2f} MB)")
                                  pos = idx + 4
                          except Exception as e:
                              pass
              mem.close()

          # Resume process cleanly
          subprocess.run(["sudo", "kill", "-CONT", str(target_pid)])
          print(f"[✔] Total unique decrypted DEX files dumped: {len(seen_md5)}")
          PYEOF

          sudo python3 /tmp/host_dumper.py

          echo "=== DAFTAR FILE DUMPED DEX DI HOST ==="
          ls -lh ~/dumped_dex/

      - name: Upload Dumped DEX to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: klikindomaret-dumped-dex
          path: ~/dumped_dex/
